<!DOCTYPE html>
<!--
  Source for the 1200x630 social-share image. Rendered to site/og-image.png by
  `npm run og` (scripts/make-og.mjs). Inline styles are fine here — this file is
  never served under the site CSP; it's only rasterized at build time.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f2f5f1;
    color: #16211b;
    padding: 76px 84px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .bar { position: absolute; left: 0; top: 0; height: 14px; width: 100%;
    background: linear-gradient(90deg, #12a06a, #0c9488); }
  .blob { position: absolute; right: -140px; bottom: -180px; width: 560px; height: 560px;
    border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(18,160,106,0.16), rgba(12,148,136,0.05)); }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  .brand .lizard { font-size: 52px; }
  .brand .name { background: linear-gradient(90deg, #12a06a, #0c9488); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 82px; line-height: 1.04; letter-spacing: -0.03em; max-width: 15ch; }
  h1 .grad { background: linear-gradient(90deg, #12a06a, #0c9488); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.tag { font-size: 34px; color: #5c6a62; margin-top: 26px; max-width: 26ch; line-height: 1.35; }
  .pills { display: flex; gap: 14px; }
  .pill { font-size: 26px; font-weight: 600; color: #0a6b49; background: #ffffff;
    border: 1px solid #e1e7e1; border-radius: 999px; padding: 12px 26px; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="blob"></div>
  <div class="brand"><span class="lizard">🦎</span><span class="name">InvoiceIguana</span></div>
  <div>
    <h1>Free <span class="grad">invoice, receipt &amp; quote</span> generator</h1>
    <p class="tag">The whole document lives in the link. No signup, nothing on a server.</p>
  </div>
  <div class="pills">
    <span class="pill">No signup</span>
    <span class="pill">No watermark</span>
    <span class="pill">Works offline</span>
  </div>
</body>
</html>
